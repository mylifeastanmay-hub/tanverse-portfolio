<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="320" height="220" fill="#090D16" rx="12" stroke="#00F2FE" stroke-opacity="0.2"/>
  <text x="18" y="28" fill="#00F2FE" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5">// INT8 QUANTIZATION ENGINE</text>
  
  <g transform="translate(20, 50)">
    <text x="0" y="22" fill="#8892B0" font-family="monospace" font-size="9">FP32 (Base)</text>
    <rect x="80" y="10" width="190" height="16" rx="4" fill="#3D4652"/>
    <text x="230" y="22" fill="#FFFFFF" font-family="monospace" font-size="9">12.4ms</text>

    <text x="0" y="62" fill="#8892B0" font-family="monospace" font-size="9">INT8 (ExecuTorch)</text>
