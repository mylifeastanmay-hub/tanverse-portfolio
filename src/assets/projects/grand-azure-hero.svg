      <stop offset="0%" stop-color="#081018"/>
      <stop offset="50%" stop-color="#0F2032"/>
      <stop offset="100%" stop-color="#050A10"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#azure-bg)" rx="16"/>
  <rect width="600" height="380" fill="none" stroke="#4FACFE" stroke-width="1.5" stroke-opacity="0.3" rx="16"/>

  <rect x="25" y="24" width="8" height="8" fill="#4FACFE"/>
