    <text x="30" y="-45" fill="#8892B0" font-family="monospace" font-size="7">PK booking_id</text>
    <text x="30" y="-32" fill="#8892B0" font-family="monospace" font-size="7">FK user_id, room</text>

    <rect x="-50" y="20" width="100" height="60" rx="6" fill="#0F2032" stroke="#10B981" stroke-width="1.5"/>
