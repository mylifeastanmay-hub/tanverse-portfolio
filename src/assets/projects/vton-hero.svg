<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11081A"/>
      <stop offset="50%" stop-color="#1A0E2E"/>
      <stop offset="100%" stop-color="#08050E"/>
    </linearGradient>
    <filter id="glow-vton" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bg-vton)" rx="16"/>
  <rect width="600" height="380" fill="none" stroke="#B600A8" stroke-width="1.5" stroke-opacity="0.35" rx="16"/>

  <!-- Telemetry Grid -->
  <g opacity="0.08" stroke="#B600A8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Header Banner -->
  <rect x="25" y="24" width="8" height="8" fill="#00F2FE"/>
  <text x="42" y="32" fill="#00F2FE" font-family="'Kanit', monospace" font-size="11" font-weight="700" letter-spacing="2">VTON ANTIGRAVITY // CROSS-SITE VIRTUAL TRY-ON ENGINE</text>
  <rect x="470" y="22" width="105" height="18" rx="9" fill="#B600A8" fill-opacity="0.2" stroke="#B600A8" stroke-width="1" stroke-opacity="0.6"/>
  <text x="522" y="34" fill="#FF66E5" font-family="'Kanit', sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">CHROME MV3 + CV</text>

  <!-- Left Pose Keypoint & Garment Warping Mesh -->
  <g transform="translate(30, 68)">
    <rect width="315" height="275" rx="12" fill="#0A0612" fill-opacity="0.88" stroke="#B600A8" stroke-opacity="0.3"/>
    <text x="16" y="26" fill="#FF66E5" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.4">// BODY ANCHOR KEYPOINTS &amp; GARMENT WARP</text>

    <!-- Split Comparison Viewport Simulation -->
    <rect x="22" y="42" width="270" height="185" rx="10" fill="#130B20" stroke="#00F2FE" stroke-opacity="0.25"/>
    <line x1="157" y1="42" x2="157" y2="227" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow-vton)"/>
    <circle cx="157" cy="135" r="11" fill="#0A0612" stroke="#00F2FE" stroke-width="2"/>
    <text x="157" y="138" fill="#00F2FE" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">&lt;&gt;</text>

    <!-- Skeletal / Torso Mesh Keypoints -->
    <circle cx="157" cy="76" r="14" fill="none" stroke="#00F2FE" stroke-width="2"/>
    <line x1="120" y1="106" x2="194" y2="106" stroke="#FF66E5" stroke-width="2.5"/>
    <polygon points="120,106 194,106 184,195 130,195" fill="#B600A8" fill-opacity="0.22" stroke="#00F2FE" stroke-width="1.8"/>
    <circle cx="120" cy="106" r="4.5" fill="#00F2FE"/>
    <circle cx="194" cy="106" r="4.5" fill="#00F2FE"/>
    <circle cx="130" cy="195" r="4.5" fill="#FF66E5"/>
    <circle cx="184" cy="195" r="4.5" fill="#FF66E5"/>

    <text x="36" y="64" fill="#8892B0" font-family="monospace" font-size="8">SOURCE AVATAR</text>
    <text x="195" y="64" fill="#00F2FE" font-family="monospace" font-size="8">IDM-VTON FITTED</text>

    <text x="22" y="252" fill="#00F2FE" font-family="monospace" font-size="9">DOM MUTATION OBSERVER: AUTO-INJECTED ON E-COMMERCE</text>
  </g>

  <!-- Right Telemetry Card -->
  <g transform="translate(365, 68)">
    <rect width="205" height="275" rx="12" fill="#0A0612" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PIPELINE TELEMETRY</text>

    <text x="16" y="58" fill="#8892B0" font-family="monospace" font-size="9">LOCAL CV WARP LATENCY</text>
    <text x="16" y="78" fill="#00F2FE" font-family="'Kanit', sans-serif" font-size="19" font-weight="800">142 ms</text>
    <line x1="16" y1="88" x2="185" y2="88" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="116" fill="#8892B0" font-family="monospace" font-size="9">EXTENSION ARCHITECTURE</text>
    <text x="16" y="136" fill="#FF66E5" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">Manifest V3</text>
    <line x1="16" y1="146" x2="175" y2="146" stroke="#B600A8" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="174" fill="#8892B0" font-family="monospace" font-size="9">CLOUD DIFFUSION BRIDGE</text>
    <text x="16" y="194" fill="#10B981" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">IDM-VTON Ready</text>
    <line x1="16" y1="204" x2="180" y2="204" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <rect x="16" y="226" width="173" height="28" rx="6" fill="#B600A8" fill-opacity="0.15" stroke="#B600A8" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="28" cy="240" r="3.5" fill="#00F2FE"/>
    <text x="38" y="243" fill="#FFFFFF" font-family="monospace" font-size="8" font-weight="700" letter-spacing="0.8">WEBCAM STUDIO + WARDROBE</text>
  </g>
</svg>
