<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#7B00FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bg-grad)" rx="16"/>
  <rect width="600" height="380" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.25" rx="16"/>

  <!-- Telemetry Grid -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Header Banner -->
  <rect x="25" y="24" width="8" height="8" fill="#00F2FE"/>
  <text x="42" y="32" fill="#00F2FE" font-family="'Kanit', monospace" font-size="11" font-weight="700" letter-spacing="2">EXECUTORCH INT8 SENTINEL // ZERO-CLOUD EDGE AI</text>
  <rect x="490" y="22" width="85" height="18" rx="9" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4"/>
  <text x="532" y="34" fill="#00F2FE" font-family="'Kanit', sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">LATENCY &lt;3ms</text>

  <!-- Center Neural Mesh -->
  <g transform="translate(180, 190)">
    <circle r="120" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <circle r="80" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="40" fill="none" stroke="#FF007A" stroke-width="1" stroke-opacity="0.3"/>

    <polygon points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" fill="#0E1726" stroke="#00F2FE" stroke-width="2" filter="url(#glow)"/>
    <circle r="8" fill="#00F2FE"/>

    <line x1="0" y1="-35" x2="0" y2="-75" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="-75" r="5" fill="#00F2FE"/>
    
    <line x1="30" y1="17" x2="70" y2="50" stroke="#FF007A" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="70" cy="50" r="5" fill="#FF007A"/>

    <line x1="-30" y1="17" x2="-70" y2="50" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="-70" cy="50" r="5" fill="#00F2FE"/>

    <line x1="30" y1="-17" x2="80" y2="-30" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="80" cy="-30" r="5" fill="#00F2FE"/>

    <line x1="-30" y1="-17" x2="-80" y2="-30" stroke="#FF007A" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="-80" cy="-30" r="5" fill="#FF007A"/>
  </g>

  <!-- Telemetry Dashboard Card Right -->
  <g transform="translate(370, 75)">
    <rect width="205" height="265" rx="12" fill="#06090F" fill-opacity="0.8" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
    
    <text x="16" y="30" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" letter-spacing="1">INFERENCE BENCHMARK</text>
    
    <text x="16" y="60" fill="#8892B0" font-family="monospace" font-size="9">LATENCY (P99)</text>
    <text x="16" y="80" fill="#00F2FE" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">2.78 ms</text>
    <line x1="16" y1="90" x2="190" y2="90" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="118" fill="#8892B0" font-family="monospace" font-size="9">MEMORY QUANTIZED</text>
    <text x="16" y="138" fill="#FF007A" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">14.2 MB (78% CUT)</text>
    <line x1="16" y1="148" x2="160" y2="148" stroke="#FF007A" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="176" fill="#8892B0" font-family="monospace" font-size="9">ACCURACY PRESERVED</text>
    <text x="16" y="196" fill="#10B981" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">99.4% vs FP32</text>
    <line x1="16" y1="206" x2="185" y2="206" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <rect x="16" y="225" width="175" height="24" rx="6" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="237" r="3" fill="#00F2FE"/>
    <text x="38" y="241" fill="#00F2FE" font-family="monospace" font-size="8" font-weight="700" letter-spacing="1">ZERO CLOUD EGRESS ACTIVE</text>
  </g>
</svg>