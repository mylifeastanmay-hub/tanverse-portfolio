<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-irr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120E"/>
      <stop offset="50%" stop-color="#0B1D18"/>
      <stop offset="100%" stop-color="#040B09"/>
    </linearGradient>
    <filter id="glow-irr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bg-irr)" rx="16"/>
  <rect width="600" height="380" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" rx="16"/>

  <!-- Telemetry Grid -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Header Banner -->
  <rect x="25" y="24" width="8" height="8" fill="#10B981"/>
  <text x="42" y="32" fill="#10B981" font-family="'Kanit', monospace" font-size="11" font-weight="700" letter-spacing="2">AI PRECISION IRRIGATION // ACO + HYBRID ML</text>
  <rect x="475" y="22" width="100" height="18" rx="9" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-width="1" stroke-opacity="0.45"/>
  <text x="525" y="34" fill="#10B981" font-family="'Kanit', sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">94.6% ML ACC</text>

  <!-- Left Multi-Zone ACO Graph & Soil Nodes -->
  <g transform="translate(30, 68)">
    <rect width="315" height="275" rx="12" fill="#050D0A" fill-opacity="0.85" stroke="#10B981" stroke-opacity="0.2"/>
    <text x="16" y="26" fill="#00F2FE" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.5">// ACO PHEROMONE ROUTING &amp; ESP32 WSN</text>

    <!-- Zone Polygons -->
    <rect x="20" y="45" width="125" height="90" rx="8" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="32" y="65" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">ZONE A (WHEAT)</text>
    <text x="32" y="88" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">28.4% VWC</text>
    <text x="32" y="106" fill="#00F2FE" font-family="monospace" font-size="8">VALVE: OPTIMAL</text>

    <rect x="165" y="45" width="130" height="90" rx="8" fill="#00F2FE" fill-opacity="0.08" stroke="#00F2FE" stroke-opacity="0.4"/>
    <text x="177" y="65" fill="#00F2FE" font-family="monospace" font-size="9" font-weight="700">ZONE B (COTTON)</text>
    <text x="177" y="88" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="18" font-weight="800">21.2% VWC</text>
    <text x="177" y="106" fill="#F59E0B" font-family="monospace" font-size="8">ACO PULSE: +14m</text>

    <!-- 72h Forecast Curve -->
    <text x="20" y="162" fill="#8892B0" font-family="monospace" font-size="9">72H LSTM + XGBOOST + RF STACKED FORECAST (R² = 0.961)</text>
    <path d="M 20 235 Q 75 190, 130 215 T 235 185 T 295 205" fill="none" stroke="#10B981" stroke-width="2.5" filter="url(#glow-irr)"/>
    <path d="M 20 242 Q 75 198, 130 220 T 235 192 T 295 212" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="130" cy="215" r="4" fill="#10B981"/>
    <circle cx="235" cy="185" r="4" fill="#00F2FE"/>
    <circle cx="295" cy="205" r="4" fill="#10B981"/>
  </g>

  <!-- Right KPI Benchmark Panel -->
  <g transform="translate(365, 68)">
    <rect width="205" height="275" rx="12" fill="#050D0A" fill-opacity="0.88" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">EMPIRICAL KPI VERIFIED</text>

    <text x="16" y="58" fill="#8892B0" font-family="monospace" font-size="9">WATER SAVED vs THRESHOLD</text>
    <text x="16" y="78" fill="#00F2FE" font-family="'Kanit', sans-serif" font-size="19" font-weight="800">-32.1% WATER</text>
    <line x1="16" y1="88" x2="185" y2="88" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="116" fill="#8892B0" font-family="monospace" font-size="9">PUMP ENERGY REDUCTION</text>
    <text x="16" y="136" fill="#10B981" font-family="'Kanit', sans-serif" font-size="19" font-weight="800">-32.4% kWh</text>
    <line x1="16" y1="146" x2="180" y2="146" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <text x="16" y="174" fill="#8892B0" font-family="monospace" font-size="9">GHG EMISSIONS (CO2/N2O/CH4)</text>
    <text x="16" y="194" fill="#F59E0B" font-family="'Kanit', sans-serif" font-size="19" font-weight="800">-20.7% CO2e</text>
    <line x1="16" y1="204" x2="165" y2="204" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <rect x="16" y="226" width="173" height="28" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="28" cy="240" r="3.5" fill="#10B981"/>
    <text x="38" y="243" fill="#10B981" font-family="monospace" font-size="8" font-weight="700" letter-spacing="0.8">EN / HI / MR VOICE ADVISORY</text>
  </g>
</svg>
